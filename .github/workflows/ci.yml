name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target/
            ~/.cargo/registry/
            ~/.cargo/git/
          key: cargo-${{ github.ref_name }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-

      - name: Run tests
        run: cd src-tauri && cargo test --lib --color always